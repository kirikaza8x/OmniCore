name: probe-images
on:
  push:
    branches: ['docs/**']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          out=""
          for img in \
            minio/minio:latest minio/minio:RELEASE.2025-04-22T22-12-26Z minio/minio:RELEASE.2025-09-07T16-13-09Z \
            quay.io/minio/minio:latest quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z \
            cgr.dev/chainguard/minio:latest chainguard/minio:latest \
            bitnami/minio:latest bitnamilegacy/minio:latest bitnamilegacy/minio:2025.7.23 \
            coollabsio/minio:latest coollabsio/minio:RELEASE.2025-10-15T17-29-55Z \
            pgsty/minio:latest pgsty/minio:RELEASE.2025-10-15T17-29-55Z \
            ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z \
            rustfs/rustfs:latest chrislusf/seaweedfs:latest dxflrs/garage:v1.0.1 ; do
            if docker manifest inspect "$img" >/dev/null 2>&1; then out="$out OK:$img"; else out="$out NO:$img"; fi
          done
          echo "::error title=probe::${out}"
