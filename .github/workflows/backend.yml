name: backend

# Restore, build and test the C# backend on every pull request and push to develop/main.
# This workflow was written without a .NET SDK or Docker available: it has NOT run yet. The first run on GitHub
# is the first real check, so expect to fix small things. The integration job is allowed to fail until it has
# passed once (continue-on-error), the build + unit-test job is the one that should be required.

on:
  pull_request:
  workflow_dispatch:
  push:
    # docs/** and fix/** so a feature branch gets a build without opening a PR first
    branches: [develop, main, 'docs/**', 'fix/**']

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/c#
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore
        shell: bash
        run: set -o pipefail; dotnet restore OmniCore.slnx 2>&1 | tee "$RUNNER_TEMP/restore.log"
      - name: Build
        shell: bash
        run: set -o pipefail; dotnet build OmniCore.slnx --no-restore -c Release 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Unit tests
        shell: bash
        run: set -o pipefail; dotnet test tests/OmniCore.Services.Auth.Domain.Tests --no-build -c Release --logger "trx;LogFileName=unit.trx" 2>&1 | tee "$RUNNER_TEMP/unit.log"
      # Errors and failures go to the job summary, which is readable on the public run page without downloading logs.
      - name: Summarise errors
        if: always()
        shell: bash
        run: |
          {
            echo "## Build and unit test problems"
            echo '```'
            cat "$RUNNER_TEMP"/restore.log "$RUNNER_TEMP"/build.log "$RUNNER_TEMP"/unit.log 2>/dev/null \
              | grep -E "error |: error|Failed|FAIL|Passed!|Failed!|Build succeeded|Warning\(s\)|Error\(s\)" | sed 's#/home/runner/work/[^/]*/[^/]*/##' | sort -u | head -150 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: backend/c#/**/TestResults/*.trx
          if-no-files-found: ignore

  integration-test:
    # Uses Testcontainers (Postgres + RabbitMQ) on the runner's Docker. Not blocking until it has passed once.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    defaults:
      run:
        working-directory: backend/c#
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Integration tests
        shell: bash
        run: set -o pipefail; dotnet test tests/OmniCore.Services.Auth.IntegrationTests -c Release --logger "trx;LogFileName=integration.trx" 2>&1 | tee "$RUNNER_TEMP/integration.log"
      - name: Summarise failures
        if: always()
        shell: bash
        run: |
          {
            echo "## Integration test output"
            echo '```'
            { grep -E -A25 "^\s*Failed |error " "$RUNNER_TEMP/integration.log" | sed 's#/home/runner/work/[^/]*/[^/]*/##' | head -120; } 2>/dev/null || true
            grep -E "Passed!|Failed!|Total tests" "$RUNNER_TEMP/integration.log" 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: backend/c#/**/TestResults/*.trx
          if-no-files-found: ignore
