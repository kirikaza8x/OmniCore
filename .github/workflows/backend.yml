name: backend

# Restore, build and test the C# backend on every pull request and push to develop/main.
# Path filters keep docs-only and frontend-only changes out. The changes job selects the affected projects; a shared
# or workflow change runs everything. First green run: 2026-11-20 (build, unit tests, integration test). Failures are
# written to the log and emitted as annotations, which are readable through the public API (the job summary is not).

on:
  pull_request:
    paths:
      - 'backend/c#/**'
      - '!backend/c#/**/*.md'
      - 'infra/docker/**'
      - '!infra/docker/**/*.md'
      - '.github/workflows/backend.yml'
  workflow_dispatch:
  push:
    # docs/** and fix/** so a feature branch gets a build without opening a PR first
    branches: [develop, main, 'docs/**', 'fix/**']
    paths:
      - 'backend/c#/**'
      - '!backend/c#/**/*.md'
      - 'infra/docker/**'
      - '!infra/docker/**/*.md'
      - '.github/workflows/backend.yml'

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Classifies the diff so the expensive jobs run only for the area that changed. A shared, solution or workflow
  # change means "all"; an unknown backend path still builds the solution.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
      shared: ${{ steps.diff.outputs.shared }}
      auth: ${{ steps.diff.outputs.auth }}
      user: ${{ steps.diff.outputs.user }}
      notification: ${{ steps.diff.outputs.notification }}
      infra: ${{ steps.diff.outputs.infra }}
      workflow: ${{ steps.diff.outputs.workflow }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify the changed files
        id: diff
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          all=false
          changed=""
          if [ "$EVENT" = workflow_dispatch ]; then
            all=true
          elif [ -z "${BASE_SHA:-}" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            # New branch or force push: there is no usable base, so run everything.
            all=true
          else
            changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
            [ -n "$changed" ] || all=true
          fi

          backend=false; shared=false; auth=false; user=false; notification=false; infra=false; workflow=false
          all_backend=false

          while IFS= read -r file; do
            [ -n "$file" ] || continue
            case "$file" in
              backend/c#/OmniCore.Shared/*|backend/c#/tests/OmniCore.Shared.Tests/*)
                shared=true; backend=true ;;
              backend/c#/OmniCore.Services.Auth/OmniCore.Services.Auth.Contracts/*)
                # Auth integration events are consumed by User and Notification
                auth=true; user=true; notification=true; backend=true ;;
              backend/c#/OmniCore.Services.Auth/*|backend/c#/tests/OmniCore.Services.Auth.*)
                auth=true; backend=true ;;
              backend/c#/OmniCore.Services.User/*|backend/c#/tests/OmniCore.Services.User.*)
                user=true; backend=true ;;
              backend/c#/OmniCore.Services.Notification/*|backend/c#/tests/OmniCore.Services.Notification.*)
                notification=true; backend=true ;;
              backend/c#/OmniCore.slnx|backend/c#/Directory.*|backend/c#/global.json|backend/c#/NuGet.config)
                all_backend=true; backend=true ;;
              backend/c#/*)
                backend=true ;;
              infra/docker/*)
                infra=true ;;
              .github/workflows/backend.yml)
                workflow=true; all=true ;;
            esac
          done <<< "$changed"

          if [ "$all" = true ]; then
            backend=true; shared=true; auth=true; user=true; notification=true; infra=true; workflow=true
          elif [ "$all_backend" = true ]; then
            backend=true; shared=true; auth=true; user=true; notification=true
          fi

          {
            echo "backend=$backend"
            echo "shared=$shared"
            echo "auth=$auth"
            echo "user=$user"
            echo "notification=$notification"
            echo "infra=$infra"
            echo "workflow=$workflow"
          } >> "$GITHUB_OUTPUT"

  build-and-unit-test:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/c#
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore
        shell: bash
        run: set -o pipefail; dotnet restore OmniCore.slnx 2>&1 | tee "$RUNNER_TEMP/restore.log"
      - name: Build
        shell: bash
        run: set -o pipefail; dotnet build OmniCore.slnx --no-restore -c Release 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Unit tests
        shell: bash
        env:
          SHARED: ${{ needs.changes.outputs.shared }}
          AUTH: ${{ needs.changes.outputs.auth }}
          USER: ${{ needs.changes.outputs.user }}
          NOTIFICATION: ${{ needs.changes.outputs.notification }}
        run: |
          set -o pipefail
          : > "$RUNNER_TEMP/unit.log"
          projects=()
          if [ "$SHARED" = true ]; then
            projects+=(tests/OmniCore.Shared.Tests)
          fi
          if [ "$SHARED" = true ] || [ "$AUTH" = true ]; then
            projects+=(tests/OmniCore.Services.Auth.Domain.Tests tests/OmniCore.Services.Auth.Application.Tests)
          fi
          if [ "$SHARED" = true ] || [ "$USER" = true ]; then
            projects+=(tests/OmniCore.Services.User.Domain.Tests tests/OmniCore.Services.User.Application.Tests)
          fi
          if [ "$SHARED" = true ] || [ "$NOTIFICATION" = true ]; then
            projects+=(tests/OmniCore.Services.Notification.Domain.Tests tests/OmniCore.Services.Notification.Application.Tests)
          fi
          if [ ${#projects[@]} -eq 0 ]; then
            echo "No unit test project matches this change."
            exit 0
          fi
          for p in "${projects[@]}"; do
            dotnet test "$p" --no-build -c Release --logger "trx;LogFileName=$(basename "$p").trx" 2>&1 | tee -a "$RUNNER_TEMP/unit.log"
          done
      - name: Annotate unit test failures
        if: always()
        shell: bash
        run: |
          TXT=$( { grep -E -A25 "^\s*Failed |Unhandled|Exception" "$RUNNER_TEMP/unit.log" | sed 's#/home/runner/work/[^/]*/[^/]*/##' | head -90; grep -E "Passed!|Failed!" "$RUNNER_TEMP/unit.log"; } 2>/dev/null || true )
          TXT="${TXT//'%'/'%25'}"; TXT="${TXT//$'\r'/}"; TXT="${TXT//$'\n'/'%0A'}"
          echo "::error title=unit-test-output::${TXT:0:6000}"
      # Errors and failures go to the job summary, which is readable on the public run page without downloading logs.
      - name: Summarise errors
        if: always()
        shell: bash
        run: |
          {
            echo "## Build and unit test problems"
            echo '```'
            cat "$RUNNER_TEMP"/restore.log "$RUNNER_TEMP"/build.log "$RUNNER_TEMP"/unit.log 2>/dev/null \
              | grep -E "error |: error|Failed|FAIL|Passed!|Failed!|Build succeeded|Warning\(s\)|Error\(s\)" | sed 's#/home/runner/work/[^/]*/[^/]*/##' | sort -u | head -150 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: backend/c#/**/TestResults/*.trx
          if-no-files-found: ignore

  integration-test:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    # Uses Testcontainers (Postgres + RabbitMQ) on the runner's Docker.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend/c#
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Integration tests
        shell: bash
        env:
          SHARED: ${{ needs.changes.outputs.shared }}
          AUTH: ${{ needs.changes.outputs.auth }}
          USER: ${{ needs.changes.outputs.user }}
          NOTIFICATION: ${{ needs.changes.outputs.notification }}
        run: |
          set -o pipefail
          : > "$RUNNER_TEMP/integration.log"
          projects=()
          if [ "$SHARED" = true ] || [ "$AUTH" = true ]; then
            projects+=(tests/OmniCore.Services.Auth.IntegrationTests)
          fi
          if [ "$SHARED" = true ] || [ "$USER" = true ]; then
            projects+=(tests/OmniCore.Services.User.IntegrationTests)
          fi
          if [ "$SHARED" = true ] || [ "$NOTIFICATION" = true ]; then
            projects+=(tests/OmniCore.Services.Notification.IntegrationTests)
          fi
          if [ ${#projects[@]} -eq 0 ]; then
            echo "No integration test project matches this change."
            exit 0
          fi
          rc=0
          # One project after the other: each binds RabbitMQ to port 5672.
          for p in "${projects[@]}"; do
            dotnet test "$p" -c Release --logger "trx;LogFileName=$(basename "$p").trx" 2>&1 | tee -a "$RUNNER_TEMP/integration.log" || rc=1
          done
          exit $rc
      # Failure text is emitted as an annotation: unlike the job summary, annotations are readable through the public API.
      - name: Annotate failures
        if: always()
        shell: bash
        run: |
          TXT=$( { grep -E -A30 "^\s*Failed |error |Unhandled|Exception" "$RUNNER_TEMP/integration.log" | sed 's#/home/runner/work/[^/]*/[^/]*/##' | head -80; grep -E "Passed!|Failed!" "$RUNNER_TEMP/integration.log"; } 2>/dev/null || true )
          TXT="${TXT//'%'/'%25'}"; TXT="${TXT//$'\r'/}"; TXT="${TXT//$'\n'/'%0A'}"
          echo "::error title=integration-test-output::${TXT:0:6000}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: backend/c#/**/TestResults/*.trx
          if-no-files-found: ignore

  # Checks that need no .NET: compose renders, the pinned image tags really exist in their registries, and the
  # gateway config is valid for the image it runs in. Only infra or workflow changes can affect these checks.
  infra-config:
    needs: changes
    if: needs.changes.outputs.infra == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose renders (dev and prod override)
        shell: bash
        working-directory: infra/docker
        run: |
          docker compose --env-file .env.example config --quiet
          sed -e 's/^ALLOWED_HOSTS=$/ALLOWED_HOSTS=api.example.com/' -e 's#^CORS_ALLOWED_ORIGIN=$#CORS_ALLOWED_ORIGIN=https://app.example.com#' -e 's#^JWT_PRIVATE_KEY_PEM=$#JWT_PRIVATE_KEY_PEM=dummy-for-config-render#' .env.example > "$RUNNER_TEMP/prod.env"
          docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file "$RUNNER_TEMP/prod.env" config --quiet
          docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.cloud-sim.yml --env-file "$RUNNER_TEMP/prod.env" config --quiet
          bash -n scripts/cloud-sim.sh
      - name: Pinned images exist
        shell: bash
        working-directory: infra/docker
        run: |
          fail=0
          for img in $(grep -hE '^\s+image:' docker-compose*.yml | awk '{print $2}' | sort -u); do
            if docker manifest inspect "$img" > /dev/null 2>&1; then echo "ok   $img"; else echo "::error::image tag not found: $img"; fail=1; fi
          done
          exit $fail
      - name: Suggest existing tags (only when a tag is missing)
        if: failure()
        shell: bash
        working-directory: infra/docker
        run: |
          for img in $(grep -hE '^\s+image:' docker-compose*.yml | awk '{print $2}' | sort -u); do
            docker manifest inspect "$img" > /dev/null 2>&1 && continue
            repo="${img%%:*}"
            case "$repo" in
              quay.io/*)
                tags=$(curl -s -m 30 "https://quay.io/api/v1/repository/${repo#quay.io/}/tag/?limit=20&onlyActiveTags=true" | python3 -c "import sys,json;d=json.load(sys.stdin);print(', '.join(t['name'] for t in d.get('tags',[])) or json.dumps(d)[:300])" 2>&1)
                echo "::error title=tags-for-$repo::$tags"; continue;;
              */*) ;;
              *) repo="library/$repo";;
            esac
            tags=$(curl -s -m 30 "https://hub.docker.com/v2/repositories/$repo/tags?page_size=15&ordering=last_updated" | python3 -c "import sys,json;d=json.load(sys.stdin);print(', '.join(r['name']+' ('+r['last_updated'][:10]+')' for r in d.get('results',[])) or json.dumps(d)[:300])" 2>&1)
            echo "::error title=tags-for-$repo::$tags"
          done
      # First real start of part of the stack (needs only Docker): proves the pinned images run and the healthchecks pass.
      - name: Smoke start of the data stores
        shell: bash
        working-directory: infra/docker
        run: |
          cp .env.example .env
          if ! docker compose up -d --wait --wait-timeout 180 postgres redis rabbitmq minio; then
            logs=$(docker compose ps -a 2>&1; docker compose logs --tail 25 postgres redis rabbitmq minio 2>&1)
            logs="${logs//'%'/'%25'}"; logs="${logs//$'\r'/}"; logs="${logs//$'\n'/'%0A'}"
            echo "::error title=smoke-start-logs::${logs:0:6000}"
            exit 1
          fi
          docker compose ps
      - name: Gateway config is valid
        run: docker run --rm -v "$PWD/infra/docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" nginx:1.27-alpine nginx -t

  # First real start of the whole stack (issue #8): builds the three service images, starts everything with the example
  # settings and fetches every Swagger spec both directly and through the gateway. A bad answer is printed in full as an
  # annotation, so a failure explains itself without anyone pasting logs.
  gateway-smoke:
    needs: changes
    if: needs.changes.outputs.infra == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        shell: bash
        working-directory: infra/docker
        run: |
          cp .env.example .env
          if ! docker compose up -d --build --wait --wait-timeout 900; then
            logs=$(docker compose ps -a 2>&1; docker compose logs --tail 30 auth-api user-api notification-api gateway 2>&1)
            logs="${logs//'%'/'%25'}"; logs="${logs//$'\r'/}"; logs="${logs//$'\n'/'%0A'}"
            echo "::error title=stack-start-logs::${logs:0:6000}"
            exit 1
          fi
          docker compose ps
      - name: Swagger specs are valid OpenAPI (direct and through the gateway)
        shell: bash
        run: |
          fail=0
          check() {
            name="$1"; url="$2"
            out=$(curl -s -m 30 -D - "$url" 2>&1 | head -c 1500)
            body=$(curl -s -m 30 "$url")
            if echo "$body" | python3 -c "import sys,json;d=json.load(sys.stdin);assert str(d.get('openapi','')).startswith('3.'), 'no openapi field'; assert d.get('paths'), 'no paths'" 2>/tmp/err; then
              echo "ok   $name"
            else
              msg="$name $url: $(cat /tmp/err | tail -1) :: $out"
              msg="${msg//'%'/'%25'}"; msg="${msg//$'\r'/}"; msg="${msg//$'\n'/'%0A'}"
              echo "::error title=bad-spec-$name::${msg:0:3000}"
              fail=1
            fi
          }
          for pair in "auth:5001" "user:5002" "notification:5003"; do
            check "direct-${pair%%:*}" "http://localhost:${pair##*:}/swagger/v1/swagger.json"
          done
          for n in auth user notification; do
            check "gateway-$n" "http://localhost:8080/specs/$n.json"
          done
          exit $fail
      - name: Swagger UI page is served by the gateway
        shell: bash
        run: |
          code=$(curl -s -o /tmp/ui.html -w '%{http_code}' -m 30 -L http://localhost:8080/swagger/)
          echo "swagger ui http $code"
          grep -q "swagger-ui" /tmp/ui.html || { echo "::error title=swagger-ui-page::http $code, body starts: $(head -c 300 /tmp/ui.html | tr '\n' ' ')"; exit 1; }
      - name: Stack logs on failure
        if: failure()
        working-directory: infra/docker
        run: docker compose logs --tail 40 auth-api gateway swagger-ui 2>&1 | tail -150

  # One stable check when this workflow runs. Skipped jobs are fine; a failed or cancelled selected job is not.
  # A docs-only change does not start the workflow at all, so do not require this check globally unless docs-only
  # PRs are exempt from the rule.
  ci-gate:
    needs: [changes, build-and-unit-test, integration-test, infra-config, gateway-smoke]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the selected jobs to pass
        shell: bash
        env:
          CHANGES: ${{ needs.changes.result }}
          BUILD: ${{ needs.build-and-unit-test.result }}
          INTEGRATION: ${{ needs.integration-test.result }}
          INFRA: ${{ needs.infra-config.result }}
          SMOKE: ${{ needs.gateway-smoke.result }}
        run: |
          set -euo pipefail
          for entry in "changes:$CHANGES" "build-and-unit-test:$BUILD" "integration-test:$INTEGRATION" "infra-config:$INFRA" "gateway-smoke:$SMOKE"; do
            name="${entry%%:*}"
            result="${entry#*:}"
            case "$result" in
              success|skipped) ;;
              *) echo "::error::$name ended with '$result'"; exit 1 ;;
            esac
          done
