version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    container_name: omnicore-postgres
    environment:
      POSTGRES_USER: omnicore
      POSTGRES_PASSWORD: omnicore_password
      POSTGRES_DB: omnicore_auth_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnicore"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: omnicore-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # AMQP Protocol
      - "15672:15672" # Management UI (http://localhost:15672)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Redis Cache
  redis:
    image: redis:7-alpine
    container_name: omnicore-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 4. MinIO (S3-Compatible Storage)
  minio:
    image: minio/minio:latest
    container_name: omnicore-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000" # API
      - "9001:9001" # Web Console (http://localhost:9001)
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
  minio_data: