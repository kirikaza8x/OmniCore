worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    server {
        listen 80;
        server_name localhost;

        # Internal Docker DNS resolver
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $swagger_ui omnicore-swagger-ui:8080;
        set $auth_api omnicore-auth-api:8080;

        # Redirect root and /swagger to /swagger/
        location = / {
            return 302 $scheme://$http_host/swagger/;
        }

        location = /swagger {
            return 302 $scheme://$http_host/swagger/;
        }

        # Proxy /swagger/ -> swagger-ui container, prefix preserved
        # (matches BASE_URL: /swagger set on the swagger-ui container)
        location /swagger/ {
            proxy_pass http://$swagger_ui;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---------------------------------------------------------------
        # Aggregated OpenAPI specs, referenced by SWAGGER_URLS in .env.
        # Each service gets one location block here.
        # ---------------------------------------------------------------

        location /specs/auth.json {
            proxy_pass http://$auth_api/swagger/v1/swagger.json;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Access-Control-Allow-Origin *;
        }

        # ---------------------------------------------------------------
        # MOCK: copy/paste this block for each new service, then add the
        # matching {"url": "/specs/<name>.json", "name": "..."} entry to
        # SWAGGER_URLS in .env.
        #
        # set $orders_api omnicore-orders-api:8080;   <- add near top with other "set" lines
        #
        # location /specs/orders.json {
        #     proxy_pass http://$orders_api/swagger/v1/swagger.json;
        #     proxy_set_header Host $http_host;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        #     add_header Access-Control-Allow-Origin *;
        # }
        # ---------------------------------------------------------------
    }
}