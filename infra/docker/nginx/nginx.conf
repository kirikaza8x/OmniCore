worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    # ---------------------------------------------------------------
    # Rate limiting (repo-check F6 / S3 / A8). Per client IP, in the gateway, so it does not depend on every service
    # being configured. Limits are deliberately simple; tune the numbers here.
    #   api_per_ip   : everything under /api/ (20 requests/s, plus a burst of 20)
    #   auth_per_ip  : login, register, refresh-token (10 requests/min, burst of 5): slows password guessing.
    # $binary_remote_addr is the address nginx sees. If this gateway sits behind another proxy or load balancer, add
    # `set_real_ip_from <proxy range>;` and `real_ip_header X-Forwarded-For;` or every client shares one bucket.
    # Services still run their own limiter, but behind this gateway it only sees the nginx address (S2).
    # ---------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=api_per_ip:10m  rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=10r/m;
    limit_req_status 429;

    server {
        listen 80;
        server_name localhost;

        resolver 127.0.0.11 valid=10s ipv6=off;
        # Compose service names, not container names: the cloud simulation runs several replicas without a fixed
        # container_name, and the service name then resolves to all of them (Docker DNS round robin).
        set $swagger_ui swagger-ui:8080;
        set $auth_api auth-api:8080;
        set $user_api user-api:8080;

        # Basic response hardening for an API. Note: a location that sets its own add_header does not inherit these.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        # Same JSON shape for every rate-limited response.
        error_page 429 = @too_many_requests;
        location @too_many_requests {
            default_type application/json;
            add_header Retry-After 60 always;
            return 429 '{"title":"Too many requests","status":429}';
        }

        location = / {
            return 302 $scheme://$http_host/swagger/;
        }

        location = /swagger {
            return 302 $scheme://$http_host/swagger/;
        }

        location /swagger/ {
            proxy_pass http://$swagger_ui;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Public signing keys of the Auth service (ADR 0003 step 4). Public data, cacheable.
        location = /.well-known/jwks.json {
            proxy_pass http://$auth_api;
        }

        location /specs/auth.json {
            proxy_pass http://$auth_api/swagger/v1/swagger.json;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Access-Control-Allow-Origin *;
        }

        # The User service does not serve endpoints yet (repo-check U1), so this answers 502 until it does.
        location /specs/user.json {
            proxy_pass http://$user_api/swagger/v1/swagger.json;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Access-Control-Allow-Origin *;
        }

        # ---------------------------------------------------------------
        # Actual API traffic -> real service, by URL prefix.
        # Each service gets one block, matching its real route prefix.
        # JWTs are validated by each service, not here (docs/decisions/0002-gateway-auth.md).
        # ---------------------------------------------------------------

        # Credential endpoints: the strict limit. A regex location wins over the prefix block below.
        # Case-insensitive and tolerant of a trailing slash on purpose: ASP.NET Core routing is both, so a stricter
        # pattern would let /Login or /login/ skip the limit.
        location ~* ^/api/v1/auth/(login|register|refresh-token)/?$ {
            limit_req zone=auth_per_ip burst=5 nodelay;
            proxy_pass http://$auth_api;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/auth/ {
            limit_req zone=api_per_ip burst=20 nodelay;
            proxy_pass http://$auth_api;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Planned prefix of the User service (profiles, avatars). The body limit is above the 5 MB avatar cap in the
        # service (nginx's default of 1 MB would reject every upload).
        location /api/v1/users/ {
            limit_req zone=api_per_ip burst=20 nodelay;
            client_max_body_size 6m;
            proxy_pass http://$user_api;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # MOCK: for a future "orders" service exposing /api/v1/orders/*
        #
        # location /api/v1/orders/ {
        #     limit_req zone=api_per_ip burst=20 nodelay;
        #     proxy_pass http://$orders_api;
        #     proxy_http_version 1.1;
        #     proxy_set_header Host $http_host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        # }
    }
}
