worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    server {
        listen 80;
        server_name localhost;

        resolver 127.0.0.11 valid=10s ipv6=off;
        set $swagger_ui omnicore-swagger-ui:8080;
        set $auth_api omnicore-auth-api:8080;

        location = / {
            return 302 $scheme://$http_host/swagger/;
        }

        location = /swagger {
            return 302 $scheme://$http_host/swagger/;
        }

        location /swagger/ {
            proxy_pass http://$swagger_ui;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /specs/auth.json {
            proxy_pass http://$auth_api/swagger/v1/swagger.json;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Access-Control-Allow-Origin *;
        }

        # ---------------------------------------------------------------
        # Actual API traffic -> real service, by URL prefix.
        # Each service gets one block, matching its real route prefix.
        # ---------------------------------------------------------------

        location /api/v1/auth/ {
            proxy_pass http://$auth_api; 
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # MOCK: for a future "orders" service exposing /api/v1/orders/*
        #
        # location /api/v1/orders/ {
        #     proxy_pass http://$orders_api/api/v1/orders/;
        #     proxy_http_version 1.1;
        #     proxy_set_header Host $http_host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        # }
    }
}