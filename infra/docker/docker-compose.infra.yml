services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    container_name: omnicore-postgres
    restart: always
    environment:
      POSTGRES_USER: omnicore
      POSTGRES_PASSWORD: omnicore_password
      POSTGRES_DB: omnicore_auth_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnicore"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - omnicore-infra-net

  # 2. RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: omnicore-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # AMQP Protocol
      - "15672:15672" # Management UI (http://localhost:15672)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - omnicore-infra-net

  # 3. Redis Cache
  redis:
    image: redis:7-alpine
    container_name: omnicore-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - omnicore-infra-net

  # 4. MinIO (S3-Compatible Storage)
  minio:
    image: minio/minio:latest
    container_name: omnicore-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000" # API
      - "9001:9001" # Web Console (http://localhost:9001)
    volumes:
      - minio_data:/data
    networks:
      - omnicore-infra-net

  # 5. Apache Kafka (KRaft Mode - No Zookeeper needed)
  kafka:
    image: apache/kafka:latest
    container_name: omnicore-kafka
    restart: always
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_LISTENERS: 'PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "9092:9092" # External Bootstrap Server
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - omnicore-infra-net

  # 6. Kafka Management UI
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: omnicore-kafka-ui
    restart: always
    ports:
      - "8080:8080" # Web UI (http://localhost:8080)
    environment:
      KAFKA_CLUSTERS_0_NAME: omnicore-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - omnicore-infra-net

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
  minio_data:
  kafka_data:

networks:
  omnicore-infra-net:
    driver: bridge