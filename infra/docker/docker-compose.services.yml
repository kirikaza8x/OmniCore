# Application services. Everything the services share is defined once in the x- blocks below; a service only lists
# what is different about it (its image, port, database, and its own JWT settings).
#
# To add a service: copy `user-api`, change the build path, container name, port, database name and Redis
# instance name; add its database to scripts/init-dbs.sql and a route in nginx/nginx.conf.

# Settings every service reads (all come from .env; defaults are the safe values).
x-service-env: &service-env
  # Application core
  ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
  ASPNETCORE_HTTP_PORTS: "8080"
  EnableSwagger: ${ENABLE_SWAGGER}
  AllowedHosts: ${ALLOWED_HOSTS:-*}

  # Logging
  Logging__LogLevel__Default: ${LOG_LEVEL_DEFAULT:-Information}
  Logging__LogLevel__Microsoft.AspNetCore: ${LOG_LEVEL_ASPNETCORE:-Warning}
  Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command: ${EF_CORE_LOG_LEVEL:-Warning}

  # Database (the connection string itself is per service)
  Database__MaxRetryCount: ${DB_MAX_RETRY_COUNT:-3}
  Database__CommandTimeout: ${DB_COMMAND_TIMEOUT:-30}
  Database__EnableDetailedErrors: ${DB_ENABLE_DETAILED_ERRORS:-false}
  Database__EnableSensitiveDataLogging: ${DB_ENABLE_SENSITIVE_DATA_LOGGING:-false}

  # Message broker
  MessageBroker__Provider: ${MESSAGE_BROKER_PROVIDER:-RabbitMQ}
  MessageBroker__Host: rabbitmq
  MessageBroker__Username: ${RABBITMQ_DEFAULT_USER}
  MessageBroker__Password: ${RABBITMQ_DEFAULT_PASS}
  MessageBroker__KafkaBootstrapServers: kafka:29092
  MessageBroker__OutboxDbProvider: ${MESSAGE_BROKER_OUTBOX_DB_PROVIDER:-Postgres}
  MessageBroker__EnableOutbox: ${MESSAGE_BROKER_ENABLE_OUTBOX:-true}

  # Redis and in-memory cache (the Redis instance name is per service)
  Redis__Host: redis
  Redis__Port: "6379"
  Redis__Password: ${REDIS_PASSWORD:-}
  MemoryCache__CompactionPercentage: ${MEMORY_CACHE_COMPACTION_PERCENTAGE:-0.05}
  MemoryCache__ExpirationScanFrequencySeconds: ${MEMORY_CACHE_EXPIRATION_SCAN_FREQUENCY_SECONDS:-60}
  MemoryCache__DefaultExpirationMinutes: ${MEMORY_CACHE_DEFAULT_EXPIRATION_MINUTES:-30}

  # Object storage (MinIO; any S3-compatible endpoint works)
  Storage__Endpoint: http://minio:9000
  Storage__AccessKey: ${MINIO_ROOT_USER}
  Storage__SecretKey: ${MINIO_ROOT_PASSWORD}
  Storage__BucketName: ${MINIO_BUCKET_NAME}
  Storage__Region: ${STORAGE_REGION:-us-east-1}
  Storage__UseSSL: ${STORAGE_USE_SSL:-false}
  Storage__PublicUrl: ${STORAGE_PUBLIC_URL:-http://localhost:9000}

  # JWT settings every service needs to validate tokens. JWT_SECRET is the legacy HS256 secret: while it is set,
  # HS256 tokens are still accepted; remove it after the RS256 cut-over (ADR 0003).
  Jwt__Secret: ${JWT_SECRET:-}
  Jwt__Issuer: ${JWT_ISSUER}
  Jwt__Audience: ${JWT_AUDIENCE}

  # CORS and rate limiting
  Cors__AllowAnyOrigin: ${CORS_ALLOW_ANY_ORIGIN:-false}
  RateLimiting__GlobalPolicy: ${RATE_LIMITING_GLOBAL_POLICY:-fixed}
  RateLimiting__Policies__fixed__PermitLimit: ${RATE_LIMITING_PERMIT_LIMIT:-100}
  RateLimiting__Policies__fixed__WindowSeconds: ${RATE_LIMITING_WINDOW_SECONDS:-60}
  RateLimiting__Policies__fixed__QueueLimit: ${RATE_LIMITING_QUEUE_LIMIT:-10}

# Container behaviour every service shares.
x-service-base: &service-base
  restart: always
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 15s
  depends_on:
    postgres: { condition: service_healthy }
    rabbitmq: { condition: service_healthy }
    redis: { condition: service_healthy }
    kafka: { condition: service_healthy }
  networks:
    - omnicore-network

services:
  auth-api:
    <<: *service-base
    build:
      context: ../../
      dockerfile: backend/c#/OmniCore.Services.Auth/OmniCore.Services.Auth.Api/Dockerfile
    container_name: omnicore-auth-api
    ports:
      - "${AUTH_SERVICE_PORT:-5001}:8080"
    environment:
      <<: *service-env
      Database__ConnectionString: Host=postgres;Port=5432;Database=${AUTH_DB_NAME};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Redis__InstanceName: ${AUTH_REDIS_INSTANCE_NAME:-OmniCore_Auth_}
      # Auth signs the tokens. RS256: set JWT_PRIVATE_KEY_PEM and Auth signs with it and publishes the public key
      # (ADR 0003 step 4).
      Jwt__PrivateKeyPem: ${JWT_PRIVATE_KEY_PEM:-}
      Jwt__PreviousPublicKeyPem: ${JWT_PREVIOUS_PUBLIC_KEY_PEM:-}
      Jwt__ExpiryMinutes: ${JWT_EXPIRY_MINUTES:-60}
      # First administrator (A15): created once on a fresh database when all three are set and no admin exists.
      # Password: 12+ characters. Remove these three lines from .env after the first start if you like.
      Admin__Email: ${ADMIN_EMAIL:-}
      Admin__Username: ${ADMIN_USERNAME:-}
      Admin__Password: ${ADMIN_PASSWORD:-}
      GoogleAuth__ServerClientId: ${GOOGLE_AUTH_SERVER_CLIENT_ID}
      GoogleAuth__ClientId: ${GOOGLE_AUTH_CLIENT_ID}

  user-api:
    <<: *service-base
    build:
      context: ../../
      dockerfile: backend/c#/OmniCore.Services.User/OmniCore.Services.User.Api/Dockerfile
    container_name: omnicore-user-api
    ports:
      - "${USER_SERVICE_PORT:-5002}:8080"
    environment:
      <<: *service-env
      Database__ConnectionString: Host=postgres;Port=5432;Database=${USER_DB_NAME};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Redis__InstanceName: ${USER_REDIS_INSTANCE_NAME:-OmniCore_User_}
      # User only validates tokens issued by Auth: it fetches the public keys from Auth's JWKS endpoint.
      Jwt__JwksUrl: ${JWT_JWKS_URL:-http://auth-api:8080/.well-known/jwks.json}
